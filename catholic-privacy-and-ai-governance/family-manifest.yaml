# The authored source of truth for which skills exist in this family, their
# domain, and their status — see build-plan.md §6.2. The router's own menu
# is generated from this file by eval/sync_skill_bundle.py, never
# hand-maintained in the router's SKILL.md.
#
# `rubric` is the project-root-relative path to the rubric this skill scores
# against. Added at build sequence step 11, when a second rubric
# (rubric/ai-criteria.md) first existed alongside the privacy one — before
# that, sync_all() assumed every skill shared one rubric, which stopped
# being true the moment a second domain had a real skill to sync.
#
# `baseline` (step 16) is the project-root-relative path to the
# vendor-review baseline a review-shaped skill checks documentation
# against — absent for every other skill, since only the review shape uses
# one.
#
# Flipping a skill from "planned" to "built": build it under
# .claude/skills/<name>/ first, then flip the status here and re-run the
# sync. sync_all() raises ManifestDriftError if a "built" entry has no
# matching folder — the ordering is enforced, not just documented.
#
# "retired" (step 17): a planned entry that turned out to duplicate an
# already-built skill — flip status rather than deleting the entry, the
# same audit-trail discipline frameworks/index.yaml already applies to a
# retired framework.
#
# Amendment, build sequence step 21: draft-ai-risk-impact-assessment's
# retired row was later removed entirely, not just left as a stub — the
# router kept volunteering its retired status unprompted even after
# SKILL.md was tightened twice to stop it, since a live row is something a
# fetching model can always choose to mention regardless of instruction
# wording. The record of *why* it was never built stays fully intact in
# build-plan.md step 17 and isn't repeated here — that's the permanent
# audit trail, not this file. This file only ever needed to be a live,
# consulted registry; once a decision no longer needs to shape live
# routing behavior, keeping its stub here bought nothing but another
# thing a model could surface unprompted. A future retirement still flips
# status first, per the paragraph above — deleting is the second, later
# step, taken deliberately, not the default.

skills:
  # --- privacy domain --------------------------------------------------
  - name: draft-privacy-impact-assessment
    domain: privacy
    status: built
    rubric: rubric/criteria.md
    trigger: "starting something new that will collect or process personal data, or asks for a PIA/DPIA by name"
  - name: triage-privacy-rights-request
    domain: privacy
    status: built
    rubric: null # triage shape (build-plan.md step 12): classification + deadline + gaps, not rubric-scored
    trigger: "an access, deletion, correction, or portability request came in"
  - name: triage-privacy-incident
    domain: privacy
    status: built
    rubric: null # incident shape (build-plan.md step 14): severity + parallel notification obligations + gaps, not rubric-scored
    trigger: "a possible data breach or privacy incident happened"
  - name: review-vendor-privacy-assessment
    domain: privacy
    status: built
    rubric: null # review shape (build-plan.md step 16): per-item baseline check + remediation + reassessment, not rubric-scored
    baseline: baselines/privacy-vendor.md
    trigger: "reviewing a vendor's privacy questionnaire, DPA, or certifications"
  - name: review-data-retention-entry
    domain: privacy
    status: built
    rubric: null # retention/verdict shape (build-plan.md step 18): single entry, single verdict, not rubric-scored
    trigger: "checking whether a data-inventory entry's retention is still justified"
  - name: map-regulatory-change
    domain: privacy
    status: built
    rubric: null # regulatory-change shape (build-plan.md step 18): impact diff against the framework registry, not rubric-scored
    trigger: "a new privacy regulatory development needs to be mapped to existing policies"
  - name: draft-privacy-notice-update
    domain: privacy
    status: built
    rubric: rubric/criteria.md
    trigger: "a privacy notice or policy section needs a proposed revision, or asks for a privacy notice update by name"

  # --- ai-governance domain ---------------------------------------------
  - name: assess-ai-system-risk-tier
    domain: ai-governance
    status: built
    rubric: rubric/ai-criteria.md
    trigger: "deploying, building, or procuring a new AI system or feature, or asks for a risk-tier classification by name"
  - name: draft-model-card
    domain: ai-governance
    status: built
    rubric: rubric/ai-criteria.md
    trigger: "an AI system or model needs a documentation record"
  - name: review-ai-vendor-governance
    domain: ai-governance
    status: built
    rubric: null # review shape (build-plan.md step 16), reused directly from review-vendor-privacy-assessment
    baseline: baselines/ai-vendor.md
    trigger: "reviewing a vendor's or foundation-model provider's AI governance documentation"
  - name: triage-ai-incident
    domain: ai-governance
    status: built
    rubric: null # incident shape (build-plan.md step 15), reused directly from triage-privacy-incident: severity + parallel notification/reporting obligations + gaps
    trigger: "a possible AI safety, bias, or reliability incident happened"
  - name: map-ai-regulatory-change
    domain: ai-governance
    status: built
    rubric: null # regulatory-change shape (build-plan.md step 18), reused directly from map-regulatory-change
    trigger: "a new AI-specific regulatory or standards development needs to be mapped to existing controls"
  - name: review-ai-system-reassessment
    domain: ai-governance
    status: built
    rubric: null # retention/verdict shape (build-plan.md step 18), reused directly from review-data-retention-entry
    trigger: "checking whether an inventoried AI system is overdue for reassessment"
