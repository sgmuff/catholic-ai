# The registry: the only file that has to change to add or retire a
# framework anywhere in this project. See build-plan.md §3.
#
# Adding a framework: author <domain>/<id>.yaml against schema.yaml, add one
# entry here, run the sync (build sequence step 5 onward).
# Retiring one: flip status to "retired" — never delete the entry or its file,
# so the registry stays an audit record of what was ever in scope.

frameworks:
