[project]
name = "cst-alignment-rubric"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "mypy>=1.13", "types-PyYAML>=6"]
# No `llm` extra: the rate-ai-use-against-cst skill's judgment happens in
# conversation, not via a Python-side API call, so no LLM client dependency
# is needed here — see eval/assessment.py's module docstring.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["eval"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eval"]
