# Run `pre-commit install` once after cloning to enable these on every commit.
# Bump the `rev` pins periodically with `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # Type-checking and the test suite are slower and touch every file, so
  # they run at push time rather than on every commit — still blocks
  # anything reaching origin before CI would catch it, without slowing
  # down the commit loop.
  - repo: local
    hooks:
      - id: cst-alignment-rubric-lint-test
        name: cst-alignment-rubric lint & test
        entry: make -C cst-alignment-rubric lint test
        language: system
        pass_filenames: false
        stages: [pre-push]
